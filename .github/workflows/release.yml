name: Release

# Dispatched, not automatic. The same call @gryt/voice makes: no changesets, one maintainer,
# and two consumers that pin a version deliberately.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'npm version argument: patch, minor, major, or an exact version like 0.1.0'
        required: true
        default: patch
      tag:
        description: 'npm dist-tag'
        required: true
        default: latest
        type: choice
        options: [latest, beta, next]

# Two dispatches at once put @gryt/voice's 0.1.0-beta.6 on npm with no commit behind it.
# Releases queue instead of racing, and are never cancelled: cancelling mid-publish is worse.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  # Trusted publishing. There is no NPM_TOKEN in this repo and there should not
  # be one — npm mints a short-lived credential from this token instead.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # OIDC publishing needs npm 11.5.1 or newer, which is ahead of what the
      # Node 24 image ships.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Against the real dist, before anything is published. It also fails on an export that
      # appeared without being listed, since a name only one app uses is the two drifting.
      - name: Check the built package imports and is complete
        run: npm run check-surface

      # The version in package.json is whatever the last release left, and this step is the
      # only thing that moves it: a hand bump makes `npm version` skip the intended one.
      - name: Set the version
        id: version
        run: |
          npm version "${{ inputs.version }}" --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: npm publish --provenance --access public --tag "${{ inputs.tag }}"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: v${{ steps.version.outputs.version }} [skip ci]"

          # The publish above cannot be undone, so this must not fail on a busy
          # main. Rebase onto whatever landed while the build ran.
          git pull --rebase origin main

          # After the rebase, not before: a rebase rewrites the commit, and --follow-tags
          # only pushes reachable tags. Annotated, because it ignores lightweight ones.
          git tag -a "v${{ steps.version.outputs.version }}" \
            -m "v${{ steps.version.outputs.version }}"

          git push origin HEAD:main --follow-tags

      - name: Summary
        run: |
          echo "Published @gryt/core@${{ steps.version.outputs.version }} to the ${{ inputs.tag }} tag." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Both apps pin this package. They should move together." >> "$GITHUB_STEP_SUMMARY"
