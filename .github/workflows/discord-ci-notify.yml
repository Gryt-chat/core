name: Discord CI notification

# Reports failed workflow runs to #ci in Discord, and the recovery. Shared implementation
# in Gryt-chat/.github. Release is listed here too, because this one publishes to npm.

on:
  workflow_run:
    workflows:
      - CI
      - Release
      - Sync Vikunja task
    types: [completed]

jobs:
  notify:
    uses: Gryt-chat/.github/.github/workflows/discord-ci-notify.yml@main
    secrets: inherit
